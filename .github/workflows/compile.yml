name: Build LaTeX docs and plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------- Checkout repo ---------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------- Get short commit hash ---------
      - name: Get short commit hash
        id: vars
        run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # --------- Compute version vMajor.Minor.Hash ---------
      - name: Compute version without patch
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          NO_PATCH="${TAG%.*}"
          FINAL_VERSION="${NO_PATCH}.${HASH}"
          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          HASH: ${{ steps.vars.outputs.hash }}

      # --------- Compile LaTeX ---------
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: latex
          root_file: rrcManual.tex
          latexmk_shell_escape: true
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"

      # --------- Upload LaTeX artifact ---------
      - name: Upload LaTeX PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: latex-pdf
          path: latex/*.pdf
          if-no-files-found: ignore

      # --------- Upload plugin artifact ---------
      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: ignore
