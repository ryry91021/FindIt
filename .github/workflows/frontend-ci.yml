name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'supabase/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [ main ]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: CI checks (lint, typecheck, tests)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          SUPABASE_TEST_DEVICE_EUI: ${{ secrets.SUPABASE_TEST_DEVICE_EUI }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          RUN_TRACKING_REPLAY_SMOKE: '1'
        run: npm run ci